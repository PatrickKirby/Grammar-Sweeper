name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Windows only: the engine drives Word and Grammarly through UI Automation, COM and Win32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Tests
        # The suite never touches Word or Grammarly; the GUI tests build offscreen.
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
